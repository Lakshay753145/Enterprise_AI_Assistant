# =============================================================================
# Aerolloy Enterprise AI Assistant - nginx
#
# Serves the built React bundle and reverse-proxies the API.
#
# The critical part is the /api/v1/chat/stream location. nginx buffers proxied
# responses by default, which would hold the entire answer until generation
# finished and destroy the streaming effect. Buffering is disabled there and
# the read timeout is raised, because a long grounded answer from a 14B model
# can legitimately take a couple of minutes.
# =============================================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

# Rate limit zones. Sized for an internal user base of a few hundred people.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;   # must exceed MAX_UPLOAD_SIZE_MB

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Uncomment once TLS is terminated in front of this server:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # =========================================================================
    # Streaming chat endpoint - buffering MUST stay off here
    # =========================================================================
    location = /api/v1/chat/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;

        # Generation can run long on CPU inference.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-cache, no-transform" always;
    }

    # =========================================================================
    # Login - tighter rate limit than the rest of the API
    # =========================================================================
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # =========================================================================
    # Document upload - Docling parsing is slow, so allow a long timeout
    # =========================================================================
    location = /api/v1/documents/upload {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =========================================================================
    # Everything else on the API
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://backend;
        access_log off;
    }

    # =========================================================================
    # Static assets
    # =========================================================================
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    # SPA fallback. index.html itself must never be cached, or a deploy leaves
    # browsers loading asset filenames that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
